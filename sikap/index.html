<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <title>SIKAP</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f4f6;
      font-family: sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #f3f4f6;
      color: #374151;
      z-index: 10;
      transition: opacity .3s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #d1d5db;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div>Memuat aplikasi...</div>
  </div>

  <!-- GANTI URL di bawah dengan URL web app Apps Script (berakhiran /exec) -->
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbxmVcXsiTZYZfxdaERkUrcY6_H1qfkGQnfEwqb3ZsC1K9BJHc2bp3fshYQHLXiO9zPLmQ/exec"
    allow="camera; microphone; geolocation; clipboard-write; fullscreen"
    allowfullscreen
    title="SIKAP">
  </iframe>

  <script>
    var frame = document.getElementById('app');
    var loading = document.getElementById('loading');
    frame.addEventListener('load', function () {
      loading.classList.add('hide');
    });
    // Jaga-jaga jika event load tidak terpicu
    setTimeout(function () { loading.classList.add('hide'); }, 15000);
  </script>
</body>
</html>
