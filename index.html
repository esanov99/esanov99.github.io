<!DOCTYPE html>
<html lang="id">
<head>
<base target="_blank">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f4f6;color:#1f2937;font-size:15px;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:12px}
  .brand{display:flex;align-items:center;gap:8px;color:#2563eb;font-weight:600;padding:8px 4px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:12px}
  h1{font-size:19px;margin:0 0 2px;line-height:1.3}
  h2{font-size:14px;margin:0 0 10px;color:#374151}
  .sub{color:#6b7280;font-size:13px}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .ok{background:#dcfce7;color:#15803d}.bad{background:#fee2e2;color:#b91c1c}.warn{background:#ffedd5;color:#c2410c}.neu{background:#f3f4f6;color:#374151}
  .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #f3f4f6;font-size:14px}
  .row:last-child{border:0}.row span:first-child{color:#6b7280}.row span:last-child{text-align:right}
  .kal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .box{border-radius:10px;padding:10px 12px;background:#f9fafb}
  .box small{display:block;color:#6b7280;font-size:12px}.box b{font-size:15px}
  .box.good{background:#f0fdf4}.box.good small,.box.good b{color:#15803d}
  .box.late{background:#fef2f2}.box.late small,.box.late b{color:#b91c1c}
  .tl{border-left:2px solid #e5e7eb;margin-left:5px;padding-left:14px}
  .ev{position:relative;padding-bottom:14px}
  .ev:before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:#9ca3af}
  .ev.first:before{background:#16a34a}
  .ev b{font-size:14px}.ev p{margin:2px 0 0;font-size:13px;color:#6b7280}
  a.pdf{display:inline-block;margin-top:4px;font-size:12px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:3px 10px;text-decoration:none}
  img.foto{width:100%;border-radius:10px;display:block}
  .empty{color:#9ca3af;font-size:13px}
  .foot{text-align:center;color:#9ca3af;font-size:12px;padding:8px 0 20px}
  .kat{font-size:12px;color:#6b7280;margin:12px 0 6px}.kat:first-of-type{margin-top:0}
  .sopi{border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .sopi b{font-size:14px}.sopi .no{font-size:12px;color:#374151;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">SIKAP <span class="sub" style="font-weight:400">Sistem Inventaris, Kalibrasi, Pemeliharaan Alat</span></div>
  <div id="app"></div>
  <div class="foot">Halaman hanya baca</div>
</div>
<script>
// GANTI dengan URL web app /exec dari Apps Script (project Scan)
const API_URL = 'https://script.google.com/macros/s/AKfycbzvst5EZjbIHeLmNcHI5ErxuaEI2z4rqi_IHpUiE9us8HwKeeiOSfznESGa4wlA-D9W/exec';
const app = document.getElementById('app');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function card(title) {
  const c = el('div', 'card');
  if (title) c.appendChild(el('h2', '', title));
  app.appendChild(c);
  return c;
}
function row(parent, label, value) {
  const r = el('div', 'row');
  r.appendChild(el('span', '', label));
  r.appendChild(el('span', '', value || '-'));
  parent.appendChild(r);
}
function statusClass(s) {
  s = String(s || '').toLowerCase();
  if (s === 'baik' || s === 'selesai') return 'ok';
  if (s === 'rusak' || s === 'batal') return 'bad';
  if (s === 'tidak beroperasi' || s === 'pending' || s === 'proses') return 'warn';
  return 'neu';
}
function fmtTgl(s) {
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return s || '-';
  const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return parseInt(m[3], 10) + ' ' + bln[parseInt(m[2], 10) - 1] + ' ' + m[1];
}

function render(DATA) {
  app.innerHTML = '';
  if (!DATA.found) {
    const c = card();
    c.appendChild(el('h1', '', 'Alat tidak ditemukan'));
    c.appendChild(el('p', 'sub', DATA.id ? 'ID ' + DATA.id + ' tidak ada di data inventaris. Coba pindai ulang labelnya.' : 'Link ini tidak memuat ID alat. Pindai QR pada label alat.'));
    return;
  }
  const a = DATA.alat;

  const head = card();
  const top = el('div', 'top');
  const left = el('div');
  left.appendChild(el('h1', '', a.Nama));
  left.appendChild(el('div', 'sub', a.ID + (a.Lokasi ? ' · ' + a.Lokasi : '')));
  top.appendChild(left);
  top.appendChild(el('span', 'pill ' + statusClass(a.Status), a.Status || '-'));
  head.appendChild(top);

  if (a.FotoId) {
    const holder = el('div');
    holder.style.marginTop = '12px';
    head.appendChild(holder);
    fetch(API_URL + '?foto=' + encodeURIComponent(a.ID))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.foto) return;
        const img = el('img', 'foto'); img.src = j.foto; img.alt = 'Foto ' + a.Nama;
        holder.appendChild(img);
      }).catch(function () {});
  }

  const d = card('Detail alat');
  row(d, 'Merk', a.Merk);
  row(d, 'Tipe', a.Tipe);
  row(d, 'Serial number', a.SerialNumber);
  row(d, 'Produksi', a.Produksi);
  row(d, 'Tahun pengadaan', a.TahunPengadaan);
  row(d, 'Sumber daya', a.SumberDaya);
  row(d, 'Daya (Watt)', a.DayaWatt);

  const k = card('Kalibrasi');
  const terbaru = DATA.kalibrasi[0];
  if (a.Dikalibrasi === 'Tidak') {
    k.appendChild(el('p', 'empty', 'Alat ini tidak dikalibrasi.'));
  } else {
    const g = el('div', 'kal');
    const terakhir = terbaru ? terbaru.Tanggal : a.TglKalibrasi;
    const b1 = el('div', 'box'); b1.appendChild(el('small', '', 'Terakhir')); b1.appendChild(el('b', '', fmtTgl(terakhir)));
    g.appendChild(b1);
    const tenggat = terbaru ? terbaru.Tenggat : '';
    const lewat = tenggat && /^\d{4}-\d{2}-\d{2}/.test(tenggat) && tenggat.slice(0, 10) < new Date().toISOString().slice(0, 10);
    const b2 = el('div', 'box ' + (tenggat ? (lewat ? 'late' : 'good') : ''));
    b2.appendChild(el('small', '', lewat ? 'Berikutnya (terlewat)' : 'Berikutnya'));
    b2.appendChild(el('b', '', tenggat ? fmtTgl(tenggat) : '-'));
    g.appendChild(b2);
    k.appendChild(g);

    const h = el('h2', '', 'Riwayat kalibrasi'); h.style.margin = '14px 0 10px'; k.appendChild(h);
    if (!DATA.kalibrasi.length) {
      k.appendChild(el('p', 'empty', 'Belum ada catatan kalibrasi.'));
    } else {
      const tl = el('div', 'tl');
      DATA.kalibrasi.forEach(function (x, i) {
        const ev = el('div', 'ev' + (i === 0 ? ' first' : ''));
        ev.appendChild(el('b', '', fmtTgl(x.Tanggal) + (x.Hasil ? ' · ' + x.Hasil : '')));
        ev.appendChild(el('p', '', [x.Vendor, x.Deskripsi].filter(Boolean).join(' · ')));
        if (x.SertifikatId) {
          const l = el('a', 'pdf', 'Lihat sertifikat PDF');
          l.href = 'https://drive.google.com/file/d/' + x.SertifikatId + '/view';
          l.target = '_blank'; l.rel = 'noopener';
          ev.appendChild(l);
        }
        tl.appendChild(ev);
      });
      k.appendChild(tl);
    }
  }

  const so = card('SOP');
  const sopList = DATA.sop || [];
  if (!sopList.length) {
    so.appendChild(el('p', 'empty', 'Belum ada SOP yang terhubung dengan alat ini.'));
  } else {
    let katSaatIni = null;
    sopList.forEach(function (x) {
      if (x.Kategori !== katSaatIni) { katSaatIni = x.Kategori; so.appendChild(el('div', 'kat', x.Kategori)); }
      const it = el('div', 'sopi');
      it.appendChild(el('b', '', x.Judul));
      it.appendChild(el('div', 'no', x.Nomor));
      it.appendChild(el('div', 'sub', 'Rev. ' + x.Revisi + ' · terbit ' + fmtTgl(x.Terbit)));
      if (x.FileId) {
        const l = el('a', 'pdf', 'Lihat SOP PDF');
        l.href = 'https://drive.google.com/file/d/' + x.FileId + '/view';
        l.target = '_blank'; l.rel = 'noopener';
        it.appendChild(l);
      }
      so.appendChild(it);
    });
  }

  const p = card('Perbaikan terakhir');
  if (!DATA.perbaikan.length) p.appendChild(el('p', 'empty', 'Belum ada catatan perbaikan.'));
  DATA.perbaikan.forEach(function (x) {
    const r = el('div', 'row');
    const l = el('span'); l.style.textAlign = 'left'; l.style.color = '#1f2937';
    l.appendChild(el('b', '', fmtTgl(x.Tanggal)));
    l.appendChild(el('div', 'sub', x.Keluhan || '-'));
    r.appendChild(l);
    r.appendChild(el('span', 'pill ' + statusClass(x.Status), x.Status || '-'));
    p.appendChild(r);
  });

  const m = card('Pemeliharaan terakhir');
  if (!DATA.pemeliharaan.length) m.appendChild(el('p', 'empty', 'Belum ada catatan pemeliharaan.'));
  DATA.pemeliharaan.forEach(function (x) {
    const r = el('div', 'row');
    r.appendChild(el('span', '', fmtTgl(x.Tanggal)));
    r.appendChild(el('span', '', x.Deskripsi || '-'));
    m.appendChild(r);
  });
}

(function load() {
  const id = (new URLSearchParams(location.search).get('id') || '').trim();
  if (!id) { render({ found: false, id: '' }); return; }
  const c = card(); c.appendChild(el('p', 'sub', 'Memuat data...'));
  fetch(API_URL + '?id=' + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (d) { render(d); })
    .catch(function () {
      app.innerHTML = '';
      const e = card();
      e.appendChild(el('h1', '', 'Gagal memuat data'));
      e.appendChild(el('p', 'sub', 'Periksa koneksi internet lalu coba pindai ulang.'));
    });
})();
</script>
</body>
</html>
